version: 0.1
cli:
  version: 1.29.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@24.20.0
    - python@3.14.4
lint:
  definitions:
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
  enabled:
    - pinact@4.1.1!
    - prettier@3.10.1
actions:
  definitions:
    - id: project-check-pre-commit
      description: Verify types, behavior, build, and formatting before a commit.
      run: npm run check
      triggers:
        - git_hooks: [pre-commit]
  enabled:
    - project-check-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
